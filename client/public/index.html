<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ActionMeet</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,300;0,600;0,900;1,300&family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #222633;
  --ink: #e8eaed;
  --mid: #b0b3ba;
  --muted: #6b7080;
  --rule: #2a2e3a;
  --accent: #00d4aa;
  --accent-soft: rgba(0,212,170,0.1);
  --accent-glow: rgba(0,212,170,0.25);
  --blue: #5b8def;
  --blue-soft: rgba(91,141,239,0.12);
  --green: #34d399;
  --green-soft: rgba(52,211,153,0.12);
  --amber: #fbbf24;
  --amber-soft: rgba(251,191,36,0.1);
  --red: #f87171;
  --mono: 'DM Mono', monospace;
  --serif: 'Fraunces', serif;
  --sans: 'Figtree', sans-serif;
  --radius: 10px;
  --shadow: 0 2px 8px rgba(0,0,0,0.3), 0 0 1px rgba(0,212,170,0.1);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
  --glass: rgba(26,29,39,0.7);
}

/* ── LIGHT MODE OVERRIDES ── */
body.light-mode { background:var(--bg); color:var(--ink); }
body.light-mode #auth-screen { background:linear-gradient(135deg,#dde8f0 0%,#e8eef8 50%,#dce8f5 100%); }
body.light-mode .auth-tab.active { background:var(--accent); color:#fff; }
body.light-mode .btn-primary { background:var(--accent); color:#fff; }
body.light-mode .btn-full { background:linear-gradient(135deg,var(--accent),#005e47); color:#fff; box-shadow:0 4px 15px var(--accent-glow); }
body.light-mode .nav-btn.active { color:var(--accent); background:var(--accent-soft); border:1px solid rgba(0,122,94,0.25); }
body.light-mode .nav-btn:hover { color:var(--ink); background:var(--surface2); }
body.light-mode .topbar { background:linear-gradient(90deg,#fff,var(--surface2)); border-bottom:1px solid var(--rule); }
body.light-mode .card:hover { border-color:rgba(0,122,94,0.3); }
body.light-mode .meeting-card:hover { border-color:rgba(0,122,94,0.3); box-shadow:0 4px 12px rgba(15,23,42,0.1); }
body.light-mode .stat-card:hover { border-color:rgba(0,122,94,0.25); transform:translateY(-2px); }
body.light-mode .agenda-item:hover { border-color:rgba(0,122,94,0.2); }
body.light-mode .badge-accent { background:rgba(0,122,94,0.1); color:var(--accent); border-color:rgba(0,122,94,0.3); }
body.light-mode .badge-open   { background:rgba(146,64,14,0.08); color:var(--amber); border-color:rgba(146,64,14,0.25); }
body.light-mode .badge-closed { background:rgba(21,128,61,0.08); color:var(--green); border-color:rgba(21,128,61,0.25); }
body.light-mode .badge-blue   { background:rgba(29,78,216,0.08); color:var(--blue);  border-color:rgba(29,78,216,0.2); }
body.light-mode .notif-card.unread { background:rgba(0,122,94,0.04); border-left:3px solid var(--accent); }
body.light-mode .modal-overlay { background:rgba(15,23,42,0.5); }
body.light-mode .settings-nav-btn.active { background:var(--accent-soft); color:var(--accent); border-color:rgba(0,122,94,0.25); }
body.light-mode .btn-ghost { color:var(--mid); border-color:var(--rule); }
body.light-mode .btn-ghost:hover { border-color:var(--accent); color:var(--accent); }
body.light-mode .btn-danger { background:rgba(185,28,28,0.08); color:var(--red); border-color:rgba(185,28,28,0.3); }
body.light-mode .btn-danger:hover { background:rgba(185,28,28,0.15); }
body.light-mode .member-avatar { color:#fff; }
body.light-mode input, body.light-mode select, body.light-mode textarea { background:var(--surface); color:var(--ink); border-color:var(--rule); }
body.light-mode input:focus, body.light-mode select:focus, body.light-mode textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
body.light-mode .toggle-switch .slider { background:var(--rule); }

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button{cursor:pointer;font-family:var(--sans);border:none;background:none}
input,select,textarea{font-family:var(--sans);font-size:14px;border:1.5px solid var(--rule);border-radius:var(--radius);padding:10px 14px;width:100%;outline:none;background:var(--surface2);color:var(--ink);transition:border-color .25s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label{font-size:13px;font-weight:600;color:var(--mid);display:block;margin-bottom:5px}
a{color:inherit;text-decoration:none}

/* ── TOAST ── */
#toast{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast-item{background:var(--surface2);color:var(--ink);font-size:13px;padding:12px 18px;border-radius:var(--radius);box-shadow:var(--shadow-lg);animation:slideIn .25s ease;display:flex;align-items:center;gap:8px;border:1px solid var(--rule)}
.toast-item.success::before{content:'✓';color:var(--green)}
.toast-item.error::before{content:'✗';color:var(--red)}
.toast-item.info::before{content:'·';color:var(--blue)}
@keyframes slideIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* ── AUTH SCREEN ── */
#auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0a0c12 0%,#131620 50%,#0d1018 100%);padding:24px;position:relative}
#auth-screen::before{content:'';position:absolute;width:400px;height:400px;background:radial-gradient(circle,var(--accent-glow) 0%,transparent 70%);top:10%;right:20%;border-radius:50%;filter:blur(80px);animation:float 8s ease-in-out infinite;pointer-events:none}
#auth-screen::after{content:'';position:absolute;width:300px;height:300px;background:radial-gradient(circle,rgba(91,141,239,0.15) 0%,transparent 70%);bottom:15%;left:15%;border-radius:50%;filter:blur(60px);animation:float 10s ease-in-out infinite reverse;pointer-events:none}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-20px) scale(1.05)}}
.auth-box{background:var(--surface);width:100%;max-width:420px;border-radius:16px;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,0.5);border:1px solid var(--rule);position:relative;z-index:1;backdrop-filter:blur(20px)}
.auth-header{background:linear-gradient(135deg,var(--surface2),var(--surface));padding:36px;text-align:center;border-bottom:1px solid var(--rule)}
.auth-logo{font-family:var(--serif);font-weight:900;font-size:2.2rem;color:var(--ink);letter-spacing:-1px}
.auth-logo span{color:var(--accent);text-shadow:0 0 20px var(--accent-glow)}
.auth-tagline{font-size:12px;color:var(--muted);margin-top:6px;font-family:var(--mono)}
.auth-body{padding:32px}
.auth-tabs{display:flex;margin-bottom:24px;border:1.5px solid var(--rule);border-radius:var(--radius);overflow:hidden}
.auth-tab{flex:1;padding:10px;font-size:13px;font-weight:600;color:var(--muted);background:none;transition:all .25s}
.auth-tab.active{background:var(--accent);color:#0f1117}
.form-group{margin-bottom:16px}
.btn-full{width:100%;padding:13px;background:linear-gradient(135deg,var(--accent),#00b894);color:#0f1117;font-size:14px;font-weight:700;border-radius:var(--radius);transition:all .3s;margin-top:8px;box-shadow:0 4px 15px var(--accent-glow)}
.btn-full:hover{transform:translateY(-1px);box-shadow:0 6px 20px var(--accent-glow)}

/* ── APP SHELL ── */
#app-shell{display:none;height:100vh;flex-direction:column}
.topbar{height:58px;background:linear-gradient(90deg,var(--surface),var(--surface2));display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0;border-bottom:1px solid var(--rule);backdrop-filter:blur(12px)}
.topbar-logo{font-family:var(--serif);font-weight:900;font-size:1.3rem;color:var(--ink);letter-spacing:-0.5px;cursor:pointer}
.topbar-logo span{color:var(--accent);text-shadow:0 0 16px var(--accent-glow)}
.topbar-nav{display:flex;gap:4px;margin-left:8px}
.nav-btn{padding:7px 15px;font-size:13px;font-weight:500;color:var(--muted);border-radius:6px;transition:all .25s}
.nav-btn:hover{color:var(--ink);background:var(--rule)}
.nav-btn.active{color:var(--accent);background:var(--accent-soft);border:1px solid rgba(0,212,170,0.2)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.user-chip{font-size:12px;color:var(--muted);font-family:var(--mono)}
.btn-logout{font-size:12px;color:var(--muted);padding:5px 12px;border:1px solid var(--rule);border-radius:6px;transition:all .25s}
.btn-logout:hover{color:var(--red);border-color:var(--red)}

/* ── MAIN AREA ── */
.app-body{flex:1;overflow:hidden;display:flex}
.main-content{flex:1;overflow-y:auto;padding:32px}

/* ── PAGE HEADER ── */
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;gap:16px}
.page-title{font-family:var(--serif);font-weight:900;font-size:1.9rem;letter-spacing:-0.5px;line-height:1.1}
.page-sub{font-size:13px;color:var(--muted);margin-top:4px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;font-size:13px;font-weight:600;border-radius:var(--radius);transition:all .25s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#0f1117}.btn-primary:hover{background:#00e6b8;box-shadow:0 4px 12px var(--accent-glow)}
.btn-danger{background:rgba(248,113,113,0.1);color:var(--red);border:1.5px solid rgba(248,113,113,0.3)}.btn-danger:hover{background:rgba(248,113,113,0.2)}
.btn-ghost{background:transparent;color:var(--mid);border:1.5px solid var(--rule)}.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-icon{padding:6px;border-radius:6px;color:var(--muted);background:transparent}.btn-icon:hover{background:var(--rule);color:var(--ink)}

/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;transition:border-color .25s}
.card:hover{border-color:rgba(0,212,170,0.2)}
.card-header{padding:16px 20px;border-bottom:1.5px solid var(--rule);display:flex;align-items:center;justify-content:space-between}
.card-body{padding:20px}
.card-title{font-weight:700;font-size:15px}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;font-family:var(--mono)}
.badge-open{background:var(--amber-soft);color:var(--amber);border:1px solid rgba(251,191,36,0.3)}
.badge-closed{background:var(--green-soft);color:var(--green);border:1px solid rgba(52,211,153,0.3)}
.badge-blue{background:var(--blue-soft);color:var(--blue);border:1px solid rgba(91,141,239,0.3)}
.badge-accent{background:var(--accent-soft);color:var(--accent);border:1px solid rgba(0,212,170,0.3)}
.badge-gray{background:var(--surface2);color:var(--muted);border:1px solid var(--rule)}

/* ── TABLES ── */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--surface2);border-bottom:1px solid var(--rule)}
th{padding:10px 16px;text-align:left;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
tbody tr{border-bottom:1px solid var(--rule);transition:background .15s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--surface2)}
td{padding:12px 16px;font-size:14px}

/* ── EMPTY STATE ── */
.empty-state{text-align:center;padding:64px 24px;color:var(--muted)}
.empty-icon{font-size:2.5rem;margin-bottom:12px;opacity:.4}
.empty-title{font-weight:700;font-size:15px;color:var(--mid);margin-bottom:6px}
.empty-sub{font-size:13px}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:flex;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(6px)}
.modal{background:var(--surface);border:1px solid var(--rule);border-radius:14px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-family:var(--serif);font-weight:900;font-size:1.3rem;letter-spacing:-0.5px}
.modal-close{font-size:20px;color:var(--muted);background:none;border:none;cursor:pointer;line-height:1;padding:2px 6px;border-radius:4px}.modal-close:hover{background:var(--rule)}
.modal-body{padding:24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--rule);display:flex;justify-content:flex-end;gap:10px}

/* ── DASHBOARD ── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.stat-card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:22px;transition:all .25s}
.stat-card:hover{border-color:rgba(0,212,170,0.2);transform:translateY(-2px)}
.stat-num{font-family:var(--serif);font-weight:900;font-size:2.2rem;letter-spacing:-1px;line-height:1}
.stat-label{font-size:12px;color:var(--muted);margin-top:4px;font-family:var(--mono)}

.meeting-grid{display:flex;flex-direction:column;gap:12px}
.meeting-card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:18px 20px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:all .25s}
.meeting-card:hover{border-color:rgba(0,212,170,0.3);box-shadow:0 4px 16px rgba(0,0,0,0.2);transform:translateY(-1px)}
.meeting-card.parent-type{border-left:3px solid var(--blue)}
.meeting-card.standalone-type{border-left:3px solid var(--rule)}
.meeting-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.meeting-icon.parent{background:var(--blue-soft)}
.meeting-icon.standalone{background:var(--surface2)}
.meeting-card-info{flex:1;min-width:0}
.meeting-card-title{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meeting-card-meta{font-size:12px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.meeting-card-stats{display:flex;gap:8px;flex-shrink:0}

/* ── MEETING DETAIL ── */
.detail-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px;padding-bottom:24px;border-bottom:1.5px solid var(--rule)}
.back-btn{font-size:13px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:4px;margin-bottom:8px;padding:0;background:none;border:none;cursor:pointer}.back-btn:hover{color:var(--ink)}
.detail-title{font-family:var(--serif);font-weight:900;font-size:2rem;letter-spacing:-1px;line-height:1.1}
.detail-meta{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}

/* ── AGENDA ── */
.agenda-add-row{display:flex;gap:10px;margin-bottom:20px}
.agenda-add-row input{flex:1}
.agenda-add-row select{width:auto;min-width:160px}

.agenda-list{display:flex;flex-direction:column;gap:8px}
.agenda-item{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:14px 16px;display:flex;align-items:flex-start;gap:12px;transition:all .25s}
.agenda-item:hover{border-color:rgba(0,212,170,0.15)}
.agenda-item.closed-item{opacity:.5}
.agenda-item.carried{border-style:dashed;border-color:rgba(139,92,246,0.3);background:rgba(139,92,246,0.05)}
.status-toggle{width:20px;height:20px;border-radius:50%;border:2px solid var(--rule);cursor:pointer;flex-shrink:0;margin-top:2px;transition:all .2s;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:10px}
.status-toggle.open{border-color:var(--amber);background:var(--amber-soft)}
.status-toggle.closed{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.agenda-content{flex:1;min-width:0}
.agenda-desc{font-size:14px;font-weight:500;line-height:1.4}
.agenda-desc.done{text-decoration:line-through;color:var(--muted)}
.agenda-sub{display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap}
.assigned-chip{font-size:11px;font-family:var(--mono);color:var(--blue);background:var(--blue-soft);border:1px solid #bfdbfe;padding:2px 8px;border-radius:20px}
.carried-chip{font-size:11px;font-family:var(--mono);color:#7c3aed;background:#faf5ff;border:1px solid #ddd6fe;padding:2px 8px;border-radius:20px}
.notes-chip{font-size:11px;color:var(--muted);font-style:italic;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agenda-actions{display:flex;gap:4px;flex-shrink:0}

/* ── FOLLOWUPS ACCORDION ── */
.followup-list{display:flex;flex-direction:column;gap:8px}
.followup-accordion{border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden}
.followup-accordion.current{border-color:var(--accent)}
.followup-header{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;background:var(--surface);transition:background .2s;user-select:none}
.followup-header:hover{background:var(--surface2)}
.followup-accordion.current .followup-header{background:linear-gradient(135deg,var(--surface2),var(--surface))}
.followup-accordion.current .followup-header *{color:var(--accent)!important}
.followup-chevron{font-size:12px;color:var(--muted);transition:transform .25s;flex-shrink:0}
.followup-chevron.open{transform:rotate(90deg)}
.followup-title{font-weight:700;font-size:14px;flex:1}
.followup-meta-text{font-size:12px;font-family:var(--mono);color:var(--muted)}
.followup-body{display:none;border-top:1px solid var(--rule);padding:20px}
.followup-body.open{display:block}

/* ── TEAM PAGE ── */
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.member-card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:20px;display:flex;align-items:center;gap:14px;transition:all .25s}
.member-card:hover{border-color:rgba(0,212,170,0.2);transform:translateY(-1px)}
.member-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--blue));color:#0f1117;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:900;font-size:1.1rem;flex-shrink:0}
.member-info{flex:1;min-width:0}
.member-name{font-weight:700;font-size:15px}
.member-phone{font-size:12px;font-family:var(--mono);color:var(--muted);margin-top:2px}
.member-actions{display:flex;gap:4px}

/* ── REMINDER PREVIEW ── */
.reminder-card{background:#0a0a0a;border-radius:var(--radius);padding:20px;margin-top:12px}
.reminder-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.whatsapp-dot{width:8px;height:8px;border-radius:50%;background:#25d366}
.reminder-app{font-size:11px;font-family:var(--mono);color:#555}
.reminder-bubble{background:#1f2c34;border-radius:8px;padding:12px 14px;font-size:13px;color:#e9edef;line-height:1.6;font-family:var(--mono)}
.reminder-bubble strong{color:#25d366}
.reminder-time{font-size:10px;color:#667781;margin-top:6px;text-align:right;font-family:var(--mono)}

/* ── SELECT ── */
.select-wrap{position:relative}
.select-wrap::after{content:'▾';position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;font-size:11px;color:var(--muted)}
.select-wrap select{appearance:none;padding-right:32px}

/* ── PROGRESS BAR ── */
.progress-bar{height:4px;background:var(--rule);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;border-radius:2px;background:var(--green);transition:width .4s ease}

/* ── TABS ── */
.tab-row{display:flex;gap:0;margin-bottom:24px;border-bottom:1.5px solid var(--rule)}
.tab{padding:10px 18px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1.5px;transition:all .2s;cursor:pointer;background:none;border-top:none;border-left:none;border-right:none}
.tab.active{color:var(--ink);border-bottom-color:var(--ink)}
.tab:hover:not(.active){color:var(--mid)}

/* ── UTIL ── */
.flex{display:flex}.gap-2{gap:8px}.gap-3{gap:12px}.items-center{align-items:center}.justify-between{justify-content:space-between}
.mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}.mt-5{margin-top:20px}
.mb-1{margin-bottom:4px}.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}
.text-muted{color:var(--muted)}.text-sm{font-size:13px}.fw-700{font-weight:700}
.hidden{display:none!important}
.divider{border:none;border-top:1.5px solid var(--rule);margin:20px 0}

/* ── ADDITIONAL STYLES FROM PREVIOUS FRONTEND ── */
.check-box{width:20px;height:20px;border-radius:6px;border:2px solid var(--rule);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;flex-shrink:0}
.check-box.checked{background:var(--accent);border-color:var(--accent);color:#fff}
.task-card{background:var(--surface);border:1.5px solid var(--rule);border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:8px;transition:.2s;cursor:pointer}
.task-card:hover{border-color:var(--ink)}
.task-body{flex:1;min-width:0}
.task-title{font-size:14px;font-weight:600;color:var(--ink)}
.task-title.done{text-decoration:line-through;color:var(--muted)}
.task-sub{font-size:11px;color:var(--muted);margin-top:2px;font-family:var(--mono)}

.notif-card{display:flex;align-items:flex-start;gap:12px;padding:14px;border-bottom:1px solid var(--rule)}
.notif-card.unread{background:var(--accent-soft)}
.notif-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.notif-icon.success{background:var(--green-soft);color:var(--green)}
.notif-icon.error{background:var(--accent-soft);color:var(--accent)}

.settings-grid{display:grid;grid-template-columns:200px 1fr;gap:32px}
.settings-nav{display:flex;flex-direction:column;gap:4px}
.settings-nav-btn{padding:10px 14px;border-radius:var(--radius);text-align:left;font-size:13px;font-weight:600;color:var(--muted);transition:.2s}
.settings-nav-btn:hover{background:var(--rule);color:var(--ink)}
.settings-nav-btn.active{background:var(--accent);color:#0f1117}

.toggle-switch{position:relative;display:inline-block;width:36px;height:20px}
.toggle-switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:var(--rule);transition:.3s;border-radius:20px}
.slider:before{position:absolute;content:"";height:14px;width:14px;left:3px;bottom:3px;background-color:white;transition:.3s;border-radius:50%}
input:checked + .slider{background-color:var(--green)}
input:checked + .slider:before{transform:translateX(16px)}

.badge-upcoming{background:var(--blue-soft);color:var(--blue);border:1px solid rgba(91,141,239,0.3)}
.badge-past{background:var(--surface2);color:var(--muted);border:1px solid var(--rule)}
.badge-upcoming::before,.badge-past::before{content:'';}
.followup-details{margin-left:24px;border-left:2px solid var(--rule);padding-left:16px;margin-top:-8px;margin-bottom:16px}
.followup-summary{cursor:pointer;font-size:12px;color:var(--muted);padding:8px 0;outline:none;user-select:none;font-family:var(--mono)}

@media(max-width:680px){
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .topbar-nav{display:none}
  .main-content{padding:16px}
  .page-header{flex-direction:column}
  .settings-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- TOAST -->
<div id="toast"></div>

<!-- AUTH SCREEN -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-header">
      <div class="auth-logo">Action<span>Meet</span></div>
      <div class="auth-tagline">meeting accountability system</div>
    </div>
    <div class="auth-body">
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchAuthTab('login')">Sign In</button>
        <button class="auth-tab" onclick="switchAuthTab('register')">Register</button>
      </div>
      <!-- Login -->
      <div id="login-form">
        <div class="form-group"><label>Email</label><input type="email" id="login-email" placeholder="you@company.com" value="alice@test.com"></div>
        <div class="form-group"><label>Password</label><input type="password" id="login-password" placeholder="••••••••" value="password123"></div>
        <button class="btn-full" onclick="doLogin()">Sign In →</button>
        <p class="text-sm text-muted mt-3" style="text-align:center">Demo: alice@test.com / password123</p>
      </div>
      <!-- Register -->
      <div id="register-form" class="hidden">
        <div class="form-group"><label>Full Name</label><input type="text" id="reg-name" placeholder="Jane Smith"></div>
        <div class="form-group"><label>Email</label><input type="email" id="reg-email" placeholder="you@company.com"></div>
        <div class="form-group"><label>Password</label><input type="password" id="reg-password" placeholder="••••••••"></div>
        <button class="btn-full" onclick="doRegister()">Create Account →</button>
      </div>
    </div>
  </div>
</div>

<!-- APP SHELL -->
<div id="app-shell">
  <div class="topbar">
    <div class="topbar-logo" onclick="navigate('dashboard')">Action<span>Meet</span></div>
    <div class="topbar-nav">
      <button class="nav-btn active" id="nav-dashboard" onclick="navigate('dashboard')">Dashboard</button>
      <button class="nav-btn" id="nav-meetings" onclick="navigate('meetings')">Meetings</button>
      <button class="nav-btn" id="nav-mytasks" onclick="navigate('mytasks')">My Tasks</button>
      <button class="nav-btn" id="nav-team" onclick="navigate('team')">Team</button>
      <button class="nav-btn" id="nav-notifications" onclick="navigate('notifications')">Notifications</button>
      <button class="nav-btn" id="nav-settings" onclick="navigate('settings')">Settings</button>
    </div>
    <div class="topbar-right">
      <span class="user-chip" id="user-chip"></span>
      <button class="btn-logout" onclick="doLogout()">Sign out</button>
    </div>
  </div>
  <div class="app-body">
    <div class="main-content" id="main-content">
      <!-- views injected here -->
    </div>
  </div>
</div>

<!-- MODALS (rendered dynamically) -->
<div id="modal-container"></div>

<script>
const API = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || !window.location.hostname)
    ? 'http://localhost:3001/api'
    : '/api';

// ═══════════════════════════════════════════════════════
// STATE (Live from API)
// ═══════════════════════════════════════════════════════
let state = {
  currentUser: null,
  token: null,
  meetings: [],
  teamMembers: [],
  agendaPoints: [],
  followups: [],
  myTasks: [],
  notifications: [],
  currentView: 'dashboard',
  currentMeetingId: null,
  settings: {
    theme: 'light',
    compactMode: false
  }
};

// ═══════════════════════════════════════════════════════
// API & HELPERS
// ═══════════════════════════════════════════════════════
let _loggingOut = false;
async function api(path, opts = {}) {
  const h = { 'Content-Type': 'application/json' };
  if (state.token) h['Authorization'] = `Bearer ${state.token}`;
  try {
    const r = await fetch(API + path, { ...opts, headers: { ...h, ...(opts.headers || {}) } });
    if (r.status === 401 && !path.includes('/auth/login') && !path.includes('/auth/me') && !_loggingOut) {
      _loggingOut = true;
      doLogout();
      toast('Session expired. Please sign in again.', 'error');
      _loggingOut = false;
      return { success: false, message: 'Unauthorized' };
    }
    const isJson = r.headers.get('content-type')?.includes('application/json');
    if (!r.ok) {
      if (isJson) return { success: false, ...await r.json() };
      return { success: false, message: `Server error (${r.status})` };
    }
    return isJson ? await r.json() : { success: true };
  } catch (err) {
    console.error('API fetch error:', err);
    return { success: false, message: 'Cannot connect to server. Is it running on port 3001?' };
  }
}

function normM(m) {
  const now = new Date();
  const d = m.scheduledFor ? new Date(m.scheduledFor) : null;
  let st = m.status || 'scheduled';
  if (['scheduled', 'in-progress'].includes(st)) st = d && d > now ? 'upcoming' : 'past';
  else if (st === 'completed') st = 'past';
  return {
    ...m, id: m._id || m.id, date: d ? d.toISOString() : '', status: st,
    type: m.meetingType === 'recurring' ? 'parent' : 'standalone'
  };
}

const $ = id => document.getElementById(id);
const uid = () => '_' + Math.random().toString(36).substr(2, 9);
const myMeetings = () => state.meetings;
const myTeam = () => state.teamMembers;
const agendaFor = mid => state.agendaPoints.filter(a => a.meetingId === mid);
const followupsFor = pid => state.followups.filter(f => f.parentMeetingId === pid).sort((a,b) => new Date(a.date) - new Date(b.date));
const memberById = id => state.teamMembers.find(m => m.id === id);
const fmtDate = d => d ? new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
const isPast = d => new Date(d) < new Date();

function toast(msg, type='info') {
  const el = document.createElement('div');
  el.className = `toast-item ${type}`;
  el.textContent = msg;
  $('toast').appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateX(16px)';
    setTimeout(() => el.remove(), 300);
  }, 4000);
}

// ═══════════════════════════════════════════════════════
// DATA LOADING
// ═══════════════════════════════════════════════════════
async function loadAll() {
  await Promise.all([
    fetchMeetings(),
    fetchTeam(),
    fetchMyTasks(),
    fetchNotifications()
  ]);
  reRenderCurrentView();
}

async function fetchMeetings() {
  try {
    const [rM, rR] = await Promise.all([api('/meetings'), api('/recurring')]);
    let all = [];
    if (rM.success) all = [...all, ...(rM.data.meetings || []).map(normM)];
    if (rR.success) all = [...all, ...(rR.data.recurringMeetings || []).map(m => {
      m.meetingType = 'recurring';
      m.scheduledFor = m.nextMeetingDate || new Date().toISOString();
      return normM(m);
    })];
    state.meetings = all;
  } catch (e) { console.error(e); }
}

async function fetchTeam() {
  try {
    const r = await api('/team');
    if (r.success) {
      const members = [];
      (r.data.teams || []).forEach(t => {
        (t.members || []).forEach(m => {
          if (m.user && m.isActive !== false) {
            members.push({
              id: m.user._id,
              name: m.user.name || m.user.email,
              email: m.user.email,
              phone: m.user.phone || '',
              role: m.role || 'member',
              teamId: t._id,
              teamName: t.name || 'Your Team'
            });
          }
        });
      });
      state.teamMembers = members;
    }
  } catch (e) { console.error(e); }
}

async function fetchMyTasks() {
  try {
    const r = await api('/tasks/my');
    if (r.success) {
      state.myTasks = (r.data.tasks || []).map(t => ({
        id: t._id,
        description: t.title || t.description || 'Task',
        notes: t.description || '',
        status: t.status === 'completed' ? 'closed' : 'open',
        meetingId: t.meeting?._id || t.meeting,
        meetingTitle: t.meeting?.title || 'Meeting',
        date: t.meeting?.scheduledFor
      }));
    }
  } catch (e) { console.error(e); }
}

async function fetchNotifications() {
  try {
    const r = await api('/notifications');
    if (r.success) {
      state.notifications = (r.data.notifications || []).map(n => ({
        id: n._id,
        text: n.text || n.message || 'Notification',
        type: n.type || 'info',
        time: n.createdAt || n.time || new Date().toISOString(),
        read: !!n.isRead
      }));
    }
    // Always seed some demo notifications if empty
    if (state.notifications.length === 0) {
      const now = Date.now();
      state.notifications = [
        { id: 'n1', text: 'Welcome to ActionMeet! Your workspace is ready.', type: 'success', time: new Date(now - 5*60000).toISOString(), read: false },
        { id: 'n2', text: 'Meeting "Weekly UI Sync" is scheduled for tomorrow at 9:00 AM.', type: 'info', time: new Date(now - 2*3600000).toISOString(), read: false },
        { id: 'n3', text: 'Q1 Kickoff Review has been marked as completed.', type: 'success', time: new Date(now - 24*3600000).toISOString(), read: true },
        { id: 'n4', text: 'You have 2 open action items due this week.', type: 'warning', time: new Date(now - 3*24*3600000).toISOString(), read: true },
      ];
    }
  } catch (e) {
    console.error(e);
    // Fallback demo notifications on error
    if (state.notifications.length === 0) {
      const now = Date.now();
      state.notifications = [
        { id: 'n1', text: 'Welcome to ActionMeet! Your workspace is ready.', type: 'success', time: new Date(now - 5*60000).toISOString(), read: false },
        { id: 'n2', text: 'Meeting "Weekly UI Sync" is scheduled for tomorrow.', type: 'info', time: new Date(now - 2*3600000).toISOString(), read: false },
      ];
    }
  }
}

// ═══════════════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════════════
function switchAuthTab(tab) {
  document.querySelectorAll('.auth-tab').forEach((t, i) => t.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'register' && i === 1)));
  $('login-form').classList.toggle('hidden', tab !== 'login');
  $('register-form').classList.toggle('hidden', tab !== 'register');
}

async function doLogin() {
  const email = $('login-email').value.trim();
  const pwd = $('login-password').value;
  if (!email || !pwd) { toast('Please enter credentials', 'error'); return; }
  
  const btn = document.querySelector('.btn-full');
  const btnText = btn ? btn.textContent : '';
  if (btn) { btn.textContent = 'Signing in…'; btn.disabled = true; }
  
  const r = await api('/auth/login', { method: 'POST', body: JSON.stringify({ email, password: pwd }) });
  
  if (btn) { btn.textContent = btnText; btn.disabled = false; }
  
  if (r.success) {
    state.token = r.data.token;
    state.currentUser = r.data.user;
    localStorage.setItem('am_tk', state.token);
    localStorage.setItem('am_u', JSON.stringify(state.currentUser));
    // Load all data FIRST, then show app so dashboard renders with real data
    await loadAll();
    showApp();
  } else {
    toast(r.message || 'Login failed — check your credentials', 'error');
  }
}

async function doRegister() {
  const name = $('reg-name').value.trim();
  const email = $('reg-email').value.trim();
  const pwd = $('reg-password').value;
  if (!name || !email || !pwd) { toast('Please fill all fields', 'error'); return; }
  
  const btn = document.querySelector('#register-form .btn-full');
  if (btn) { btn.textContent = 'Creating account…'; btn.disabled = true; }
  
  const r = await api('/auth/register', { method: 'POST', body: JSON.stringify({ name, email, password: pwd }) });
  
  if (btn) { btn.textContent = 'Create Account →'; btn.disabled = false; }
  
  if (r.success) {
    toast('Account created! Sign in now.', 'success');
    $('reg-name').value = ''; $('reg-email').value = ''; $('reg-password').value = '';
    switchAuthTab('login');
  } else {
    toast(r.message || 'Registration failed', 'error');
  }
}

function doLogout() {
  state.token = null;
  state.currentUser = null;
  state.meetings = [];
  state.teamMembers = [];
  state.myTasks = [];
  state.notifications = [];
  localStorage.removeItem('am_tk');
  localStorage.removeItem('am_u');
  // Always reset screen state cleanly
  const auth = $('auth-screen');
  const app = $('app-shell');
  if (auth) auth.style.display = 'flex';
  if (app) app.style.display = 'none';
  switchAuthTab('login');
}

function showApp() {
  $('auth-screen').style.display = 'none';
  $('app-shell').style.display = 'flex';
  const name = state.currentUser?.name || state.currentUser?.email || 'User';
  $('user-chip').textContent = name;
  navigate('dashboard');
}

// ═══════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════
function navigate(view, meetingId = null) {
  state.currentView = view;
  state.currentMeetingId = meetingId;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const nb = $('nav-' + view);
  if (nb) nb.classList.add('active');
  
  if (view === 'dashboard') renderDashboard();
  else if (view === 'team') renderTeam();
  else if (view === 'meeting') renderMeetingDetail(meetingId);
  else if (view === 'parent') renderParentDetail(meetingId);
  else if (view === 'mytasks') renderMyTasks();
  else if (view === 'notifications') renderNotifications();
  else if (view === 'settings') renderSettings();
  else if (view === 'meetings') renderMeetingsPage();
}


// ═══════════════════════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════════════════════
function renderDashboard() {
  const meetings = myMeetings();
  const upcoming = meetings.filter(m => m.status === 'upcoming').length;
  const myOpen = state.myTasks.filter(t => t.status === 'open').length;
  const myClosed = state.myTasks.filter(t => t.status === 'closed').length;

  let html = `
  <div class="page-header">
    <div>
      <div class="page-title">Dashboard</div>
      <div class="page-sub">Welcome back, ${state.currentUser.name || state.currentUser.email}</div>
    </div>
    <div class="flex gap-2">
      <button class="btn btn-ghost" onclick="openNewMeetingModal()">+ Standalone Meeting</button>
      <button class="btn btn-primary" onclick="openNewParentModal()">+ Recurring Meeting</button>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-num">${meetings.length}</div>
      <div class="stat-label">Total Meetings</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" style="color:var(--amber)">${myOpen}</div>
      <div class="stat-label">My Open Tasks</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" style="color:var(--green)">${myClosed}</div>
      <div class="stat-label">My Completed</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" style="color:var(--blue)">${state.notifications.filter(n=>!n.read).length}</div>
      <div class="stat-label">Unread Alerts</div>
    </div>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;margin-top:40px">
    <h2 style="font-size:18px;font-weight:700">Recent Meetings</h2>
    <button class="btn btn-ghost btn-sm" onclick="navigate('meetings')">View All →</button>
  </div>

  <div class="meeting-grid">`;

  if (meetings.length === 0) {
    html += `<div class="empty-state"><div class="empty-icon">📅</div><div class="empty-title">No meetings yet</div><div class="empty-sub">Create your first meeting to get started</div></div>`;
  }

  // Grouping logic (Tree view)
  const mTreeMap = {};
  meetings.forEach(m => mTreeMap[m.id] = { ...m, children: [] });
  
  const roots = [];
  meetings.forEach(m => {
    if (m.parentMeeting && mTreeMap[m.parentMeeting]) {
      mTreeMap[m.parentMeeting].children.push(mTreeMap[m.id]);
    } else {
      roots.push(mTreeMap[m.id]);
    }
  });

  const renderNode = (node) => {
    let nodeHtml = renderMeetingCard(node);
    if (node.children && node.children.length > 0) {
      node.children.sort((a,b) => new Date(b.date) - new Date(a.date));
      nodeHtml += `
        <details class="followup-details">
          <summary class="followup-summary">Show ${node.children.length} Follow-up session${node.children.length!==1?'s':''}</summary>
          <div class="meeting-grid" style="margin-top:8px">
            ${node.children.map(renderNode).join('')}
          </div>
        </details>`;
    }
    return nodeHtml;
  };

  html += roots.map(renderNode).join('');
  html += `</div>`;
  $('main-content').innerHTML = html;
}

function renderMeetingCard(m) {
  const icon = m.type === 'parent' ? '🔁' : '📅';
  const iconCls = m.type === 'parent' ? 'parent' : 'standalone';
  const typeCls = m.type === 'parent' ? 'parent-type' : 'standalone-type';
  const clickFn = m.type === 'parent' ? `navigate('parent','${m.id}')` : `navigate('meeting','${m.id}')`;
  const statusBadge = m.status === 'upcoming'
    ? `<span class="badge badge-blue">⬆ Upcoming</span>`
    : m.status === 'past'
    ? `<span class="badge badge-gray">✓ Past</span>`
    : `<span class="badge badge-gray">${m.status}</span>`;
  
  return `
  <div class="meeting-card ${typeCls}" onclick="${clickFn}">
    <div class="meeting-icon ${iconCls}">${icon}</div>
    <div class="meeting-card-info">
      <div class="meeting-card-title">${m.title}</div>
      <div class="meeting-card-meta">${fmtDate(m.date)} ${m.type==='parent'?' · Recurring':''}</div>
    </div>
    <div class="meeting-card-stats">
      ${statusBadge}
    </div>
    <div style="flex-shrink:0">
      <button class="btn-icon" onclick="event.stopPropagation();deleteMeeting('${m.id}')" title="Delete">🗑</button>
    </div>
  </div>`;
}

function renderMeetingsPage() {
  const meetings = myMeetings();
  let html = `
  <div class="page-header">
    <div>
      <div class="page-title">All Meetings</div>
      <div class="page-sub">Comprehensive list of your meeting history and schedule</div>
    </div>
  </div>
  <div class="meeting-grid">
    ${meetings.length ? meetings.map(renderMeetingCard).join('') : `<div class="empty-state">No meetings found.</div>`}
  </div>`;
  $('main-content').innerHTML = html;
}


// ═══════════════════════════════════════════════════════
// STANDALONE MEETING DETAIL
// ═══════════════════════════════════════════════════════
function renderMeetingDetail(mid) {
  const m = state.meetings.find(x=>x.id===mid) || state.followups.find(x=>x.id===mid);
  if (!m) { navigate('dashboard'); return; }
  const agenda = agendaFor(mid);
  const openItems = agenda.filter(a=>a.status==='open');
  const closedItems = agenda.filter(a=>a.status==='closed');
  const total = agenda.length;
  const closedPct = total ? Math.round(closedItems.length/total*100) : 0;

  let html = `
  <button class="back-btn" onclick="navigate('dashboard')">← Back to Dashboard</button>
  <div class="detail-header">
    <div>
      <div class="detail-title">${m.title}</div>
      <div class="detail-meta">
        <span class="badge badge-gray">📅 ${fmtDate(m.date)}</span>
        ${m.type==='followup'?`<span class="badge badge-blue">Follow-up #${m.followupSequence}</span>`:''}
        ${isPast(m.date)?`<span class="badge badge-closed">Completed</span>`:`<span class="badge badge-open">Upcoming</span>`}
      </div>
    </div>
    <div class="flex gap-2">
      <button class="btn btn-ghost btn-sm" onclick="previewReminders('${mid}')">📱 Preview Reminders</button>
      <button class="btn btn-primary btn-sm" onclick="sendReminders('${mid}')">Send WhatsApp</button>
    </div>
  </div>

  <div class="card mb-4">
    <div class="card-header">
      <div class="card-title">Task Progress</div>
      <div class="text-sm text-muted">${closedItems.length}/${total} complete</div>
    </div>
    <div class="card-body">
      <div class="progress-bar"><div class="progress-fill" style="width:${closedPct}%"></div></div>
      <div class="flex gap-2 mt-3">
        <span class="badge badge-open">↑ ${openItems.length} open</span>
        <span class="badge badge-closed">✓ ${closedItems.length} closed</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-title">Agenda Points</div>
    </div>
    <div class="card-body">
      <div class="agenda-add-row">
        <input type="text" id="add-desc-${mid}" placeholder="Add agenda point…" onkeydown="if(event.key==='Enter')addAgenda('${mid}')">
        <div class="select-wrap">
          <select id="add-person-${mid}">
            <option value="">— Assign person —</option>
            ${myTeam().map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}
          </select>
        </div>
        <input type="text" id="add-notes-${mid}" placeholder="Notes (optional)" style="max-width:180px">
        <button class="btn btn-primary btn-sm" onclick="addAgenda('${mid}')">+ Add</button>
      </div>
      ${renderAgendaList(agenda, mid)}
    </div>
  </div>`;

  $('main-content').innerHTML = html;
}

function renderAgendaList(items, mid) {
  if (items.length === 0) return `<div class="empty-state" style="padding:32px"><div class="empty-icon">✅</div><div class="empty-title">No agenda points yet</div></div>`;
  const open = items.filter(a=>a.status==='open');
  const closed = items.filter(a=>a.status==='closed');
  const sorted = [...open,...closed];
  return `<div class="agenda-list">${sorted.map(a=>agendaItemHTML(a,mid)).join('')}</div>`;
}

function agendaItemHTML(a, mid) {
  const person = memberById(a.responsiblePersonId);
  const carried = a.carriedForwardFromId ? `<span class="carried-chip">↩ carried forward</span>` : '';
  const personChip = person ? `<span class="assigned-chip">👤 ${person.name}</span>` : '';
  const notesChip = a.notes ? `<span class="notes-chip" title="${a.notes}">📝 ${a.notes}</span>` : '';
  return `
  <div class="agenda-item ${a.status==='closed'?'closed-item':''} ${a.carriedForwardFromId?'carried':''}" id="ai-${a.id}">
    <button class="status-toggle ${a.status}" onclick="toggleStatus('${a.id}','${mid}')" title="Toggle status">
      ${a.status==='closed'?'✓':''}
    </button>
    <div class="agenda-content">
      <div class="agenda-desc ${a.status==='closed'?'done':''}">${a.description}</div>
      <div class="agenda-sub">${personChip}${carried}${notesChip}</div>
    </div>
    <div class="agenda-actions">
      <button class="btn-icon btn-sm" onclick="editAgendaModal('${a.id}','${mid}')" title="Edit">✏️</button>
      <button class="btn-icon btn-sm" onclick="deleteAgenda('${a.id}','${mid}')" title="Delete">🗑</button>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════
// PARENT (RECURRING) MEETING DETAIL
// ═══════════════════════════════════════════════════════
function renderParentDetail(mid) {
  const m = state.meetings.find(x=>x.id===mid);
  if (!m) { navigate('dashboard'); return; }
  const fups = followupsFor(mid);
  const currentFup = fups[fups.length-1];

  let html = `
  <button class="back-btn" onclick="navigate('dashboard')">← Back to Dashboard</button>
  <div class="detail-header">
    <div>
      <div class="detail-title">${m.title}</div>
      <div class="detail-meta">
        <span class="badge badge-blue">🔁 Recurring</span>
        ${m.recurrence?.enabled?`<span class="badge badge-gray">${m.recurrence.frequency}</span>`:''}
        <span class="badge badge-gray">${fups.length} sessions total</span>
      </div>
    </div>
    <div class="flex gap-2">
      <button class="btn btn-ghost btn-sm" onclick="previewReminders('${currentFup?.id||''}')">📱 Preview Reminders</button>
      <button class="btn btn-primary btn-sm" onclick="openNewFollowupModal('${mid}')">+ Schedule Follow-up</button>
    </div>
  </div>

  <div class="followup-list" id="followup-list">`;

  if (fups.length === 0) {
    html += `<div class="empty-state"><div class="empty-icon">🗂️</div><div class="empty-title">No follow-ups yet</div><div class="empty-sub">Schedule the first follow-up to get started</div></div>`;
  }

  [...fups].reverse().forEach((f, ri) => {
    const isCurrent = ri === 0;
    const agenda = agendaFor(f.id);
    const open = agenda.filter(a=>a.status==='open').length;
    const closed = agenda.filter(a=>a.status==='closed').length;
    html += `
    <div class="followup-accordion ${isCurrent?'current':''}" id="fup-${f.id}">
      <div class="followup-header" onclick="toggleFollowup('${f.id}')">
        <span class="followup-chevron ${isCurrent?'open':''}" id="chev-${f.id}">▶</span>
        <div class="followup-title">Session #${f.followupSequence} — ${fmtDate(f.date)}</div>
        <span class="followup-meta-text">${open} open · ${closed} done</span>
        ${isCurrent?`<span class="badge" style="background:#ffffff22;color:#fff;border-color:#ffffff44">Current</span>`:''}
      </div>
      <div class="followup-body ${isCurrent?'open':''}" id="fup-body-${f.id}">
        <div class="flex justify-between items-center mb-3">
          <div class="text-sm text-muted fw-700">Agenda for ${fmtDate(f.date)}</div>
          <div class="flex gap-2">
            <button class="btn btn-ghost btn-sm" onclick="sendReminders('${f.id}')">📱 Send Reminders</button>
            <button class="btn btn-primary btn-sm" onclick="openAddAgendaToFollowup('${f.id}')">+ Add Point</button>
          </div>
        </div>
        ${renderAgendaList(agenda, f.id)}
      </div>
    </div>`;
  });

  html += `</div>`;
  $('main-content').innerHTML = html;
}

function toggleFollowup(fid) {
  const body = $('fup-body-'+fid);
  const chev = $('chev-'+fid);
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  chev.classList.toggle('open', !isOpen);
}

function addAgenda(mid) {
  const desc = $('add-desc-'+mid)?.value?.trim();
  const personId = $('add-person-'+mid)?.value;
  const notes = $('add-notes-'+mid)?.value?.trim()||'';
  if (!desc) { toast('Please enter a description','error'); return; }
  state.agendaPoints.push({id:uid(),meetingId:mid,userId:state.currentUser.id,description:desc,responsiblePersonId:personId||null,status:'open',notes,carriedForwardFromId:null});
  toast('Agenda point added','success');
  reRenderCurrentView();
}

function toggleStatus(aid, mid) {
  const a = state.agendaPoints.find(x=>x.id===aid);
  if (!a) return;
  a.status = a.status === 'open' ? 'closed' : 'open';
  reRenderCurrentView();
}

function deleteAgenda(aid, mid) {
  state.agendaPoints = state.agendaPoints.filter(a=>a.id!==aid);
  toast('Removed','info');
  reRenderCurrentView();
}

function editAgendaModal(aid, mid) {
  const a = state.agendaPoints.find(x=>x.id===aid);
  if (!a) return;
  openModal(`
    <div class="modal-header"><div class="modal-title">Edit Agenda Point</div><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="form-group"><label>Description</label><input id="ea-desc" value="${a.description}"></div>
      <div class="form-group"><label>Assign to</label>
        <div class="select-wrap"><select id="ea-person">
          <option value="">— None —</option>
          ${myTeam().map(t=>`<option value="${t.id}" ${t.id===a.responsiblePersonId?'selected':''}>${t.name}</option>`).join('')}
        </select></div>
      </div>
      <div class="form-group"><label>Notes</label><input id="ea-notes" value="${a.notes||''}"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEditAgenda('${aid}','${mid}')">Save</button>

  `);
}

function saveEditAgenda(aid, mid) {
  const a = state.agendaPoints.find(x=>x.id===aid);
  a.description = $('ea-desc').value.trim()||a.description;
  a.responsiblePersonId = $('ea-person').value||null;
  a.notes = $('ea-notes').value.trim();

}

function openAddAgendaToFollowup(fid) {

      <div class="form-group"><label>Assign to</label>

          ${myTeam().map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}
        </select></div>
      </div>
      <div class="form-group"><label>Notes</label><input id="fa-notes" placeholder="Optional notes"></div>

    <div class="modal-footer">

      <button class="btn btn-primary" onclick="addAgendaToFollowup('${fid}')">Add</button>

function addAgendaToFollowup(fid) {
  const desc = $('fa-desc').value.trim();
  if (!desc) { toast('Enter a description','error'); return; }
  state.agendaPoints.push({id:uid(),meetingId:fid,userId:state.currentUser.id,description:desc,responsiblePersonId:$('fa-person').value||null,status:'open',notes:$('fa-notes').value.trim()||'',carriedForwardFromId:null});

    <div class="modal-body">

function createMeeting() {
  const title = $('nm-title').value.trim();
  const date = $('nm-date').value;
  if (!title||!date) { toast('Fill all fields','error'); return; }
  state.meetings.push({id:uid(),userId:state.currentUser.id,title,date,type:'standalone',status:'upcoming',recurrence:null});
  closeModal(); toast('Meeting created','success'); navigate('dashboard');
}

function openNewParentModal() {
  openModal(`
    <div class="modal-header"><div class="modal-title">New Recurring Meeting</div><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="form-group"><label>Meeting Title</label><input id="np-title" placeholder="e.g. Leads Meeting"></div>
      <div class="form-group"><label>Start Date</label><input type="date" id="np-date" value="${new Date().toISOString().split('T')[0]}"></div>
      <div class="form-group"><label>Frequency</label>
        <div class="select-wrap"><select id="np-freq">
          <option>weekly</option><option>bi-weekly</option><option>monthly</option><option>daily</option>
        </select></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="createParentMeeting()">Create</button>
    </div>

function createParentMeeting() {
  const title = $('np-title').value.trim();
  const date = $('np-date').value;
  const freq = $('np-freq').value;
  if (!title||!date) { toast('Fill all fields','error'); return; }
  state.meetings.push({id:uid(),userId:state.currentUser.id,title,date,type:'parent',status:'upcoming',recurrence:{enabled:true,frequency:freq,dayOfWeek:1}});
  closeModal(); toast('Recurring meeting created','success'); navigate('dashboard');
}

function deleteMeeting(mid) {
  if (!confirm('Delete this meeting and all its data?')) return;
  state.meetings = state.meetings.filter(m=>m.id!==mid);
  state.followups = state.followups.filter(f=>f.parentMeetingId!==mid);
  state.agendaPoints = state.agendaPoints.filter(a=>a.meetingId!==mid);
  toast('Deleted','info'); navigate('dashboard');
}

function openNewFollowupModal(parentId) {
  const fups = followupsFor(parentId);
  const lastFup = fups[fups.length-1];
  const openTasks = lastFup ? agendaFor(lastFup.id).filter(a=>a.status==='open') : [];
  openModal(`
    <div class="modal-header"><div class="modal-title">Schedule Follow-up</div><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="form-group"><label>Date</label><input type="date" id="fup-date" value="${new Date(Date.now()+7*86400000).toISOString().split('T')[0]}"></div>
      ${openTasks.length>0?`
        <div style="background:var(--amber-soft);border:1.5px solid #fde68a;border-radius:var(--radius);padding:14px 16px;margin-top:8px">
          <div class="fw-700 text-sm mb-2">⚡ ${openTasks.length} open task${openTasks.length>1?'s':''} will carry forward:</div>
          ${openTasks.map(t=>`<div class="text-sm" style="padding:3px 0;border-bottom:1px solid #fde68a">· ${t.description}</div>`).join('')}
        </div>`:'<p class="text-sm text-muted mt-2">No open tasks to carry forward.</p>'}
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="createFollowup('${parentId}')">Schedule & Carry Forward</button>
    </div>
  `);
}

function createFollowup(parentId) {
  const date = $('fup-date').value;
  if (!date) { toast('Pick a date','error'); return; }
  const parent = state.meetings.find(m=>m.id===parentId);
  const fups = followupsFor(parentId);
  const lastFup = fups[fups.length-1];
  const seq = lastFup ? lastFup.followupSequence + 1 : 1;
  const newFup = {id:uid(),userId:state.currentUser.id,parentMeetingId:parentId,title:parent.title,date,type:'followup',followupSequence:seq,status:'upcoming'};
  state.followups.push(newFup);
  // Carry forward open tasks
  if (lastFup) {
    const openTasks = agendaFor(lastFup.id).filter(a=>a.status==='open');
    openTasks.forEach(t => {
      state.agendaPoints.push({id:uid(),meetingId:newFup.id,userId:state.currentUser.id,description:t.description,responsiblePersonId:t.responsiblePersonId,status:'open',notes:t.notes,carriedForwardFromId:t.id});
    });
    toast(`Follow-up #${seq} created. ${openTasks.length} task${openTasks.length!==1?'s':''} carried forward.`, 'success');
  } else {
    toast(`Follow-up #${seq} scheduled.`, 'success');
  }
  closeModal();
  renderParentDetail(parentId);
}

// ═══════════════════════════════════════════════════════
// TEAM PAGE
// ═══════════════════════════════════════════════════════
let _activeTeamId = null; // tracks which team is currently shown

function renderTeam() {
  // Gather unique teams from state
  const teamsMap = {};
  state.teamMembers.forEach(m => { if (!teamsMap[m.teamId]) teamsMap[m.teamId] = { id: m.teamId, name: m.teamName || 'Your Team', members: [] }; teamsMap[m.teamId].members.push(m); });
  const teams = Object.values(teamsMap);

  // If we have a valid active team, keep it; otherwise pick first
  if (!_activeTeamId || !teamsMap[_activeTeamId]) _activeTeamId = teams[0]?.id || null;
  const activeTeam = teamsMap[_activeTeamId] || null;
  const members = activeTeam ? activeTeam.members : [];

  const teamSelectorHtml = teams.length > 1
    ? `<select id="team-selector" style="margin-left:12px;width:auto;min-width:180px;font-weight:600" onchange="switchActiveTeam(this.value)">
        ${teams.map(t => `<option value="${t.id}" ${t.id===_activeTeamId?'selected':''}>${t.name}</option>`).join('')}
       </select>`
    : (activeTeam ? `<span style="margin-left:12px;font-size:13px;color:var(--muted);font-family:var(--mono)">${activeTeam.name}</span>` : '');

  let html = `
  <div class="page-header">
    <div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px">
      <div>
        <div class="page-title" style="display:flex;align-items:center">Team${teamSelectorHtml}</div>
        <div class="page-sub">${members.length} member${members.length!==1?'s':''} · ${teams.length} team${teams.length!==1?'s':''}</div>
      </div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost" onclick="openCreateTeamModal()">+ New Team</button>
      <button class="btn btn-primary" onclick="openAddMemberModal()" ${!_activeTeamId?'disabled title="Create a team first"':''}>+ Add Member</button>
    </div>
  </div>`;

  if (teams.length === 0) {
    html += `<div class="empty-state" style="padding:80px">
      <div class="empty-icon">👥</div>
      <div class="empty-title">No teams yet</div>
      <div class="empty-sub">Create your first team to start organizing members and meetings.</div>
      <button class="btn btn-primary mt-4" onclick="openCreateTeamModal()">Create First Team</button>
    </div>`;
    $('main-content').innerHTML = html;
    return;
  }

  html += `<div class="team-grid">`;
  members.forEach(m => {
    const initials = (m.name || '?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    const roleColor = m.role === 'admin' ? 'badge-accent' : 'badge-gray';
    html += `
    <div class="member-card">
      <div class="member-avatar">${initials}</div>
      <div class="member-info">
        <div class="member-name">${m.name}</div>
        <div class="member-phone" style="font-size:12px;color:var(--muted)">${m.email}</div>
        ${m.phone ? `<div style="font-size:11px;color:var(--muted);font-family:var(--mono)">${m.phone}</div>` : ''}
        <div style="margin-top:6px"><span class="badge ${roleColor}">${m.role}</span></div>
      </div>
      <div class="member-actions" style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">
        <button class="btn-icon" onclick="editMemberModal('${m.id}')" title="Edit role">✏️</button>
        <button class="btn-icon" onclick="deleteMember('${m.id}')" title="Remove member" style="color:var(--red)">🗑</button>
      </div>
    </div>`;
  });
  html += `</div>`;
  $('main-content').innerHTML = html;
}

function switchActiveTeam(teamId) {
  _activeTeamId = teamId;
  renderTeam();
}

// CREATE TEAM MODAL
// ═══════════════════════════════════════════════════════
function openCreateTeamModal() {
  openModal(`
    <div class="modal-header">
      <div class="modal-title">🏢 Create New Team</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Team Name <span style="color:var(--red)">*</span></label>
        <input type="text" id="new-team-name" placeholder="e.g. Frontend Engineering" autofocus>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="new-team-desc" rows="3" placeholder="What does this team work on?" style="resize:vertical"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="create-team-btn" onclick="createTeam()">Create Team</button>
    </div>
  `);
  setTimeout(() => $('new-team-name')?.focus(), 50);
}

async function createTeam() {
  const name = $('new-team-name')?.value.trim();
  const description = $('new-team-desc')?.value.trim();
  if (!name) { toast('Team name is required', 'error'); return; }

  const btn = $('create-team-btn');
  if (btn) { btn.textContent = 'Creating…'; btn.disabled = true; }

  const r = await api('/team', { method: 'POST', body: JSON.stringify({ name, description }) });

  if (btn) { btn.textContent = 'Create Team'; btn.disabled = false; }

  if (r.success) {
    toast(`Team "${name}" created!`, 'success');
    closeModal();
    // Add the new team's id as active and refresh
    _activeTeamId = r.data?.team?._id || null;
    await fetchTeam();
    renderTeam();
  } else {
    toast(r.message || 'Failed to create team', 'error');
  }
}

// ═══════════════════════════════════════════════════════
// ADD MEMBER MODAL (with live user search)
// ═══════════════════════════════════════════════════════
async function openAddMemberModal() {
  if (!_activeTeamId) { toast('Create a team first', 'error'); return; }

  // Pre-load all users for search
  const usersRes = await api('/team/search/users?limit=50');
  const allUsers = usersRes.data?.users || [];

  // Filter out users already in the active team
  const existingIds = new Set(state.teamMembers.filter(m => m.teamId === _activeTeamId).map(m => m.id));
  const available = allUsers.filter(u => !existingIds.has(u._id));

  const userOptionsHtml = available.length
    ? available.map(u => `<option value="${u._id}">${u.name} (${u.email})</option>`).join('')
    : '<option disabled>No available users found</option>';

  openModal(`
    <div class="modal-header">
      <div class="modal-title">➕ Add Team Member</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Search User</label>
        <input type="text" id="member-search" placeholder="Type name or email to filter…" oninput="filterMemberList(this.value)" autocomplete="off">
      </div>
      <div class="form-group">
        <label>Select User <span style="color:var(--red)">*</span></label>
        <select id="member-userid" size="5" style="height:auto;min-height:110px">
          ${userOptionsHtml}
        </select>
        <div style="font-size:11px;color:var(--muted);margin-top:4px">${available.length} user${available.length!==1?'s':''} available</div>
      </div>
      <div class="form-group">
        <label>Role</label>
        <select id="invite-role">
          <option value="member">Member</option>

function filterMemberList(q) {
  const sel = $('member-userid');
  if (!sel || !window._availableUsers) return;
  const filtered = q
    ? window._availableUsers.filter(u => (u.name + u.email).toLowerCase().includes(q.toLowerCase()))
    : window._availableUsers;
  sel.innerHTML = filtered.length
    ? filtered.map(u => `<option value="${u._id}">${u.name} (${u.email})</option>`).join('')
    : '<option disabled>No users match</option>';
}

async function addSelectedMember() {
  const userId = $('member-userid')?.value;
  const role   = $('invite-role')?.value || 'member';
  if (!userId || userId === 'undefined') { toast('Please select a user', 'error'); return; }

  const btn = $('add-member-btn');
  if (btn) { btn.textContent = 'Adding…'; btn.disabled = true; }

  const r = await api(`/team/${_activeTeamId}/members`, { method: 'POST', body: JSON.stringify({ userId, role }) });

  if (btn) { btn.textContent = 'Add Member'; btn.disabled = false; }

  if (r.success) {
    toast('Member added!', 'success');
    delete window._availableUsers;
    closeModal();
    await fetchTeam();
    renderTeam();
  } else {
    toast(r.message || 'Failed to add member', 'error');
  }
}

async function inviteMember() {
  const email = $('invite-email')?.value.trim();
  const role  = $('invite-role')?.value || 'member';
  if (!email) return toast('Email is required', 'error');
  if (!_activeTeamId) return toast('No active team', 'error');
  const searchRes = await api(`/team/search/users?q=${encodeURIComponent(email)}`);
  const foundUser = (searchRes.data?.users || []).find(u => u.email === email);
  if (!foundUser) return toast('No user found with that email', 'error');
  const r = await api(`/team/${_activeTeamId}/members`, { method: 'POST', body: JSON.stringify({ userId: foundUser._id, role }) });
  if (r.success) { toast('Member added!', 'success'); closeModal(); await fetchTeam(); renderTeam(); }
  else toast(r.message || 'Error adding member', 'error');
}

// REMINDERS (WHATSAPP PREVIEW)
// ═══════════════════════════════════════════════════════
function previewReminders(mid) {
  const agenda = agendaFor(mid).filter(a=>a.status==='open'&&a.responsiblePersonId);
  const grouped = {};
  agenda.forEach(a => {
    if (!grouped[a.responsiblePersonId]) grouped[a.responsiblePersonId] = [];
    grouped[a.responsiblePersonId].push(a);
  });
  const meetingObj = state.meetings.find(m=>m.id===mid)||state.followups.find(f=>f.id===mid);
  const meetDate = meetingObj ? fmtDate(meetingObj.date) : 'upcoming meeting';

  if (Object.keys(grouped).length === 0) {
    openModal(`
      <div class="modal-header"><div class="modal-title">📱 Reminder Preview</div><button class="modal-close" onclick="closeModal()">×</button></div>
      <div class="modal-body"><div class="empty-state"><div class="empty-icon">📬</div><div class="empty-title">No reminders to send</div><div class="empty-sub">All tasks are closed or unassigned</div></div></div>
      <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Close</button></div>
    `); return;
  }
  let bubbles = Object.entries(grouped).map(([personId, tasks]) => {
    const person = memberById(personId);
    const taskLines = tasks.map((t,i) => `${i+1}. ${t.description}`).join('\n');
    const msg = `🗓 *ActionMeet Reminder*\n\nHi ${person?.name||'there'}, you have ${tasks.length} open task${tasks.length>1?'s':''} due for the meeting on *${meetDate}*:\n\n${taskLines}\n\nPlease ensure these are completed before the meeting. Thank you!`;
    return `
    <div class="mt-4">
      <div class="text-sm fw-700 mb-1">→ ${person?.name} (${person?.phone})</div>
      <div class="reminder-card">
        <div class="reminder-header">
          <div class="whatsapp-dot"></div>
          <div class="reminder-app">WhatsApp · ActionMeet Bot</div>
        </div>
        <div class="reminder-bubble">${msg.replace(/\n/g,'<br>').replace(/\*(.*?)\*/g,'<strong>$1</strong>')}</div>
        <div class="reminder-time">8:00 AM · Scheduled</div>
      </div>
    </div>`;
  }).join('');

  openModal(`
    <div class="modal-header"><div class="modal-title">📱 Reminder Preview</div><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <p class="text-sm text-muted mb-2">${Object.keys(grouped).length} recipient${Object.keys(grouped).length>1?'s':''} · sent daily at 8:00 AM</p>
      ${bubbles}
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Close</button>
      <button class="btn btn-primary" onclick="sendReminders('${mid}');closeModal()">Send Now</button>
    </div>
  `, '600px');
}

function sendReminders(mid) {
  const agenda = agendaFor(mid).filter(a=>a.status==='open'&&a.responsiblePersonId);
  if (agenda.length === 0) { toast('No open assigned tasks to remind','info'); return; }
  const people = [...new Set(agenda.map(a=>a.responsiblePersonId))];
  toast(`📱 WhatsApp reminders sent to ${people.length} team member${people.length>1?'s':''}!`, 'success');
}

function renderMyTasks() {

async function toggleTaskStatus(taskId, meetingId) {
  const task = state.myTasks.find(t => t.id === taskId);
  if (!task) return;
  
  const newStatus = task.status === 'open' ? 'completed' : 'open';
  try {
    const r = await api(`/agenda/${taskId}`, { method: 'PUT', body: JSON.stringify({ status: newStatus }) });
    if (r.success) {
      toast(`Task marked as ${newStatus}`, 'success');
      await fetchMyTasks();
      reRenderCurrentView();
    }
  } catch (e) { toast('Error updating task', 'error'); }
}

// ═══════════════════════════════════════════════════════
function timeAgo(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'Just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  return `${Math.floor(h/24)}d ago`;
}

function notifIcon(type) {
  return type === 'success' ? '✅' : type === 'warning' ? '⚠️' : type === 'error' ? '❌' : 'ℹ️';
}

function renderNotifications() {
  const notifs = state.notifications;
  const unread = notifs.filter(n => !n.read).length;
  let html = `
  <div class="page-header">
    <div>
      <div class="page-title">Notifications ${unread > 0 ? `<span class="badge badge-accent" style="font-size:13px;margin-left:8px">${unread} new</span>` : ''}</div>
      <div class="page-sub">Stay updated with meeting and team activity</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost btn-sm" onclick="addDemoNotification()">+ Test</button>
      <button class="btn btn-ghost btn-sm" onclick="markAllRead()">Mark all read</button>
    </div>
  </div>
  <div class="card" style="padding:0;overflow:hidden">`;

  if (notifs.length === 0) {
    html += `<div class="empty-state" style="padding:48px">
      <div class="empty-icon">🔔</div>
      <div class="empty-title">All caught up!</div>
      <div class="empty-sub">No notifications right now.</div>
    </div>`;
  } else {
    notifs.forEach((n, i) => {
      html += `
      <div class="notif-card ${n.read ? '' : 'unread'}" onclick="markRead('${n.id}')" style="cursor:pointer;display:flex;align-items:flex-start;gap:12px;padding:14px 18px;border-bottom:${i<notifs.length-1?'1px solid var(--rule)':'none'};transition:background .15s" onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background=''">
        <div style="font-size:1.3rem;flex-shrink:0;margin-top:1px">${notifIcon(n.type)}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:14px;font-weight:${n.read?'400':'600'};color:${n.read?'var(--mid)':'var(--fg)'}">${n.text}</div>
          <div style="font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:4px">${timeAgo(n.time)}</div>
        </div>
        ${!n.read ? '<div style="width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:6px"></div>' : ''}
      </div>`;
    });
  }

  html += `</div>`;
  $('main-content').innerHTML = html;
}

function markRead(id) {
  const n = state.notifications.find(x => x.id === id);
  if (n && !n.read) { n.read = true; renderNotifications(); }
}

async function markAllRead() {
  state.notifications.forEach(n => n.read = true);
  toast('All notifications marked as read', 'info');
  renderNotifications();
}

function addDemoNotification() {
  const demos = [
    { text: 'New meeting invite: "Product Roadmap Q2" scheduled for next Tuesday.', type: 'info' },
    { text: 'Action item "Review PR #42" is due tomorrow.', type: 'warning' },
    { text: 'Bob Builder completed task "Finalize Dark Mode CSS".', type: 'success' },
    { text: 'You were mentioned in a meeting note by Alice Admin.', type: 'info' },
    { text: 'Weekly digest: 3 meetings, 5 tasks completed this week.', type: 'success' },
  ];
  const d = demos[Math.floor(Math.random() * demos.length)];
  state.notifications.unshift({ id: 'n_' + Date.now(), text: d.text, type: d.type, time: new Date().toISOString(), read: false });
  renderNotifications();
  toast(d.text.slice(0, 60) + '…', d.type === 'warning' ? 'error' : 'success');
}

async function saveProfile() {
  const name = $('set-name').value.trim();
  const phone = $('set-phone')?.value.trim() || '';
  const bio   = $('set-bio')?.value.trim() || '';
  if (!name) { toast('Name cannot be empty', 'error'); return; }
  const btn = document.querySelector('#settings-content .btn-primary');
  if (btn) { btn.textContent = 'Saving…'; btn.disabled = true; }
  const r = await api('/auth/profile', { method: 'PUT', body: JSON.stringify({ name, phone, bio }) });
  if (btn) { btn.textContent = 'Save Changes'; btn.disabled = false; }
  if (r.success) {
    state.currentUser = { ...state.currentUser, name, phone, bio };
    localStorage.setItem('am_u', JSON.stringify(state.currentUser));
    $('user-chip').textContent = name;
    toast('Profile updated ✓', 'success');
    switchSettingsTab('profile'); // Re-render to update initials
  } else { toast(r.message || 'Failed to save', 'error'); }
}

function saveSetting(key, val) {
  state.settings[key] = val;
  try { localStorage.setItem('am_settings', JSON.stringify(state.settings)); } catch(e) {}
  if (key === 'defaultView') toast(`Default view set to ${val}`, 'success');
  else toast('Setting saved', 'success');
}

function toggleTheme(isDark) {
  saveSetting('theme', isDark ? 'dark' : 'light');
  const r = document.documentElement;
  if (isDark) {
    // ── DARK MODE (restore original values) ──
    r.style.setProperty('--bg',         '#0f1117');
    r.style.setProperty('--surface',    '#1a1d27');
    r.style.setProperty('--surface2',   '#222633');
    r.style.setProperty('--ink',        '#e8eaed');
    r.style.setProperty('--fg',         '#e8eaed');
    r.style.setProperty('--mid',        '#b0b3ba');
    r.style.setProperty('--muted',      '#6b7080');
    r.style.setProperty('--rule',       '#2a2e3a');
    r.style.setProperty('--accent',     '#00d4aa');
    r.style.setProperty('--accent-soft','rgba(0,212,170,0.1)');
    r.style.setProperty('--accent-glow','rgba(0,212,170,0.25)');
    r.style.setProperty('--blue',       '#5b8def');
    r.style.setProperty('--blue-soft',  'rgba(91,141,239,0.12)');
    r.style.setProperty('--green',      '#34d399');
    r.style.setProperty('--green-soft', 'rgba(52,211,153,0.12)');
    r.style.setProperty('--amber',      '#fbbf24');
    r.style.setProperty('--amber-soft', 'rgba(251,191,36,0.1)');
    r.style.setProperty('--red',        '#f87171');
    r.style.setProperty('--shadow',     '0 2px 8px rgba(0,0,0,0.3), 0 0 1px rgba(0,212,170,0.1)');
    r.style.setProperty('--shadow-lg',  '0 8px 32px rgba(0,0,0,0.4)');
    r.style.setProperty('--glass',      'rgba(26,29,39,0.7)');
    document.body.classList.remove('light-mode');
    document.body.classList.add('dark-mode');
    toast('Dark mode 🌙', 'success');
  } else {
    // ── LIGHT MODE — WCAG AA compliant (all ratios ≥ 4.5:1 on white) ──
    // --ink #0f172a on #fff = 17:1 ✓  --mid #334155 on #fff = 9.7:1 ✓
    // --muted #64748b on #fff = 4.7:1 ✓  --accent #007a5e on #fff = 5.1:1 ✓
    r.style.setProperty('--bg',         '#f1f5f9');    // cool slate-100 page bg
    r.style.setProperty('--surface',    '#ffffff');    // card / modal bg
    r.style.setProperty('--surface2',   '#f8fafc');    // input / secondary bg
    r.style.setProperty('--ink',        '#0f172a');    // primary text — slate-900
    r.style.setProperty('--fg',         '#0f172a');
    r.style.setProperty('--mid',        '#334155');    // secondary — slate-700, 9.7:1
    r.style.setProperty('--muted',      '#64748b');    // muted — slate-500, 4.7:1
    r.style.setProperty('--rule',       '#cbd5e1');    // dividers — slate-300, visible
    r.style.setProperty('--accent',     '#007a5e');    // dark teal — 5.1:1 on white
    r.style.setProperty('--accent-soft','rgba(0,122,94,0.1)');
    r.style.setProperty('--accent-glow','rgba(0,122,94,0.2)');
    r.style.setProperty('--blue',       '#1d4ed8');    // blue-700 — 7.5:1 on white
    r.style.setProperty('--blue-soft',  'rgba(29,78,216,0.08)');
    r.style.setProperty('--green',      '#15803d');    // green-700 — 6.6:1 on white
    r.style.setProperty('--green-soft', 'rgba(21,128,61,0.08)');
    r.style.setProperty('--amber',      '#92400e');    // amber-800 — 7.6:1 on white
    r.style.setProperty('--amber-soft', 'rgba(146,64,14,0.08)');
    r.style.setProperty('--red',        '#b91c1c');    // red-700 — 6.3:1 on white

    r.style.setProperty('--shadow-lg',  '0 8px 24px rgba(15,23,42,0.12)');

  }
  if ($('settings-content')) switchSettingsTab('appearance');

function saveNotifSetting(key, val) {
  if (!state.settings.notifications) state.settings.notifications = {};
  const wasOff = state.settings.notifications[key] === false;
  state.settings.notifications[key] = val;
  try { localStorage.setItem('am_settings', JSON.stringify(state.settings)); } catch(e) {}
  const label = key.replace(/([A-Z])/g,' $1').toLowerCase();
  if (val && wasOff) {
    // Push a real in-app notification demonstrating the channel
    const demo = {
      meetingReminders: 'Meeting reminder: "Weekly UI Sync" starts in 30 minutes.',
      meetingUpdates:   '"Q1 Kickoff" has been rescheduled to next Friday.',
      newMeetings:      'You have been invited to "Product Roadmap Q2".',
      taskAssigned:     'Alice Admin assigned you: "Review the new dashboard design".',
      taskDue:          '2 action items are overdue and need your attention.',
      taskCompleted:    'Bob Builder completed: "Finalize Dark Mode CSS".',
      weeklyDigest:     'Weekly digest: 5 meetings, 8 tasks completed this week.',
      productUpdates:   'ActionMeet v1.1 is here — check out the new Team features!',
    };
    if (demo[key]) {
      state.notifications.unshift({ id: 'ns_'+Date.now(), text: demo[key], type: 'info', time: new Date().toISOString(), read: false });
      toast(`${label} enabled — sample notification added`, 'success');
    }
  } else {
    toast(`${val ? 'Enabled' : 'Disabled'} ${label}`, val ? 'success' : 'info');
  }
}

function enableAllNotifs() {
  const keys = ['meetingReminders','meetingUpdates','newMeetings','taskAssigned','taskDue','taskCompleted','weeklyDigest','productUpdates'];
  if (!state.settings.notifications) state.settings.notifications = {};
  keys.forEach(k => state.settings.notifications[k] = true);
  try { localStorage.setItem('am_settings', JSON.stringify(state.settings)); } catch(e) {}
  toast('All notifications enabled', 'success');
  switchSettingsTab('notifications');
}

function checkPwStrength(val) {
  const el = $('pw-strength');
  if (!el || !val) { if (el) el.innerHTML = ''; return; }
  let score = 0;
  if (val.length >= 8) score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;
  const labels = ['Weak','Fair','Good','Strong'];
  const colors = ['var(--red)','var(--amber)','var(--blue)','var(--green)'];
  el.innerHTML = `<div style="display:flex;align-items:center;gap:8px;margin-top:6px">
    <div style="flex:1;height:4px;background:var(--surface2);border-radius:2px;overflow:hidden">
      <div style="height:100%;width:${score*25}%;background:${colors[score-1]||'var(--rule)'};transition:all .3s;border-radius:2px"></div>
    </div>
    <span style="font-size:12px;color:${colors[score-1]||'var(--muted)'};font-weight:600;min-width:48px">${score>0?labels[score-1]:''}</span>
  </div>`;
}

function toggleCompact(val) {
  saveSetting('compactMode', val);
  document.body.classList.toggle('compact-mode', val);
  toast(val ? 'Compact mode on' : 'Compact mode off', 'success');
}

function revokeSession() {
  toast('Session revoked', 'success');
}

function exportData(fmt) {
  const data = {
    user: state.currentUser,
    meetings: state.meetings,
    tasks: state.myTasks,
    exportedAt: new Date().toISOString()
  };
  let content, mime, ext;
  if (fmt === 'json') {
    content = JSON.stringify(data, null, 2);
    mime = 'application/json'; ext = 'json';
  } else {
    const rows = [['Type','Title','Date','Status']];
    state.meetings.forEach(m => rows.push(['Meeting', m.title, m.date, m.status]));
    state.myTasks.forEach(t => rows.push(['Task', t.description, t.date||'', t.status]));
    content = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    mime = 'text/csv'; ext = 'csv';
  }
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `actionmeet-export.${ext}`; a.click();
  URL.revokeObjectURL(url);
  toast(`Exported as ${ext.toUpperCase()}`, 'success');
}

function confirmDeleteAccount() {
  openModal(`
    <div class="modal-header"><div class="modal-title" style="color:var(--red)">⚠️ Delete Account</div><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <p style="margin-bottom:16px;color:var(--mid)">This will <strong>permanently delete</strong> your account and all associated data. This action <strong>cannot be undone</strong>.</p>
      <div class="form-group"><label>Type <strong>DELETE</strong> to confirm</label><input type="text" id="delete-confirm" placeholder="Type DELETE here"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="deleteAccount()">Permanently Delete</button>
    </div>
  `);
}

async function deleteAccount() {
  const val = $('delete-confirm')?.value;
  if (val !== 'DELETE') { toast('Please type DELETE to confirm', 'error'); return; }
  toast('Account deletion request sent', 'info');
  closeModal();
  setTimeout(() => doLogout(), 1500);
}

  else if (state.currentView === 'meeting') renderMeetingDetail(state.currentMeetingId);
  else if (state.currentView === 'parent') renderParentDetail(state.currentMeetingId);

// ── BOOT ──
window.onload = async () => {
  // Restore persisted settings (theme, compact mode, etc.)
  try {
    const saved = localStorage.getItem('am_settings');
    if (saved) state.settings = { ...state.settings, ...JSON.parse(saved) };
    if (state.settings.compactMode) document.body.classList.add('compact-mode');
    if (state.settings.theme === 'light') toggleTheme(false);
    else if (state.settings.theme === 'dark') toggleTheme(true);
  } catch(e) {}
  const tk = localStorage.getItem('am_tk');
  const u  = localStorage.getItem('am_u');

  if (tk && u) {
    // Validate the token against the live server before trusting it
    state.token = tk;
    state.currentUser = JSON.parse(u);

    const check = await api('/auth/me');
    if (!check.success) {
      // Token is stale/invalid — clear and show login
      localStorage.removeItem('am_tk');
      localStorage.removeItem('am_u');
      state.token = null;
      state.currentUser = null;
      $('auth-screen').style.display = 'flex';
      $('app-shell').style.display = 'none';
      switchAuthTab('login');
      toast('Session expired — please sign in again.', 'info');
      return;
    }

    // Token is valid — refresh user data from server
    state.currentUser = check.data?.user || state.currentUser;
    localStorage.setItem('am_u', JSON.stringify(state.currentUser));

    // Show loading placeholder immediately
    $('auth-screen').style.display = 'none';
    $('app-shell').style.display = 'flex';
    $('user-chip').textContent = state.currentUser?.name || state.currentUser?.email || 'User';
    $('main-content').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-family:var(--mono);font-size:13px;gap:8px"><span style="animation:spin 1s linear infinite;display:inline-block">&#9696;</span> Loading ActionMeet…</div>';

    await loadAll();
    navigate('dashboard');
  } else {
    $('auth-screen').style.display = 'flex';
    $('app-shell').style.display = 'none';
    switchAuthTab('login');
  }
};
</script>
